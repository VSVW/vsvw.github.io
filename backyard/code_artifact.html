<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wind Instrument Coach</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: sans-serif; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- ヘッダー -->
  <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
    <h1 class="font-bold text-lg text-emerald-400">Wind Coach PWA</h1>
    <button id="btn-start" class="bg-emerald-500 text-slate-900 px-4 py-2 rounded-full font-bold shadow-lg active:scale-95 transition-transform">
      MIC START
    </button>
  </header>

  <!-- 🌟デバッグ用ファイル入力パネル追加 -->
  <div class="bg-slate-900 p-4 border-b border-slate-800">
    <div class="text-xs text-slate-400 mb-2 font-bold uppercase tracking-wider">Debug: File Input</div>
    <div class="flex flex-col gap-3">
      <input type="file" id="file-input" accept="audio/*" class="text-sm text-slate-300 file:mr-4 file:py-1.5 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-emerald-400 hover:file:bg-slate-700 cursor-pointer">
      <div class="flex gap-3 items-center">
        <button id="btn-play-file" class="bg-slate-800 text-slate-500 px-4 py-1.5 rounded-full font-bold shadow-sm text-xs transition-colors" disabled>
          PLAY
        </button>
        <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1" class="flex-1 accent-emerald-500 cursor-pointer" disabled>
        <div id="time-display" class="text-xs text-slate-400 font-mono w-12 text-right">00:00</div>
      </div>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <main class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto">
    
    <!-- 測定値表示パネル（リニューアル） -->
    <div class="flex flex-col gap-4">
      
      <!-- Pitch Meter (TDM-700風 アナログチューナー針) -->
      <div class="bg-slate-900 rounded-xl border border-slate-800 p-4 relative flex flex-col items-center shadow-inner">
        <div class="text-xs text-slate-400 mb-2 font-bold w-full tracking-widest">PITCH DEVIATION</div>
        <div class="relative w-full max-w-md aspect-[2/1] mt-2">
            <canvas id="pitch-canvas" class="absolute inset-0 w-full h-full"></canvas>
        </div>
        <div id="target-display" class="absolute top-4 right-4 text-xs text-slate-500 bg-slate-950 px-2 py-1 rounded">Target: --</div>
      </div>

      <!-- Volume Bar (ピークホールド付き横長バー) -->
      <div class="bg-slate-900 rounded-xl border border-slate-800 p-4 shadow-inner">
        <div class="flex justify-between items-end mb-3">
          <div class="text-xs text-slate-400 font-bold tracking-widest">VOLUME (RMS)</div>
        </div>
        <div class="relative h-6 bg-slate-950 rounded-full border border-slate-800 overflow-hidden shadow-inner">
          <!-- 音量バー本体 -->
          <div id="vol-bar" class="absolute top-0 bottom-0 left-0 bg-gradient-to-r from-emerald-500 via-yellow-400 to-red-500 transition-all duration-75" style="width: 0%"></div>
          <!-- ピーク線 -->
          <div id="vol-peak" class="absolute top-0 bottom-0 w-1 bg-white z-10 transition-all duration-75" style="left: 0%"></div>
        </div>
      </div>

      <!-- 🌟 倍音量バー (Overtone Bar) 追加 -->
      <div class="bg-slate-900 rounded-xl border border-slate-800 p-4 shadow-inner mt-4">
        <div class="flex justify-between items-end mb-3">
          <div class="text-xs text-slate-400 font-bold tracking-widest">OVERTONE RICHNESS (倍音の豊かさ)</div>
        </div>
        <div class="relative h-4 bg-slate-950 rounded-full border border-slate-800 overflow-hidden shadow-inner">
          <div id="overtone-bar" class="absolute top-0 bottom-0 left-0 bg-gradient-to-r from-fuchsia-500 to-purple-500 transition-all duration-75" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- 🌟 逆引き診断結果パネルのUI拡張 -->
    <div id="diagnosis-panel" class="bg-slate-900 border border-slate-800 rounded-xl p-4 hidden">
      <div class="text-xs text-amber-400 font-bold mb-2">リアルタイム診断 (コーチAI)</div>
      <div id="diag-title" class="text-lg font-bold text-slate-100 mb-2">診断中...</div>
      <div id="diag-action" class="text-sm text-emerald-300 font-medium mb-3"></div>
      <div class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-800/60">
        <span>アプローチする身体部位:</span>
        <span id="diag-target-body" class="px-2.5 py-1 bg-slate-800 text-slate-200 font-bold rounded-full">--</span>
      </div>
    </div>

  </main>

  <script>
    // --- UI要素の取得 ---
    const btnStart = document.getElementById('btn-start');
    const volBar = document.getElementById('vol-bar');
    const volPeak = document.getElementById('vol-peak');
    const overtoneBar = document.getElementById('overtone-bar');
    const pitchCanvas = document.getElementById('pitch-canvas');
    const pitchCtx = pitchCanvas.getContext('2d');
    const diagPanel = document.getElementById('diagnosis-panel');
    const diagTitle = document.getElementById('diag-title');
    const diagAction = document.getElementById('diag-action');

    // 🌟デバッグ用UI要素の取得
    const fileInput = document.getElementById('file-input');
    const btnPlayFile = document.getElementById('btn-play-file');
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');

    // --- 音声処理の変数 ---
    let audioCtx = null;
    let analyser = null;
    let microphone = null;
    let mediaElementSource = null;
    let audioElement = new Audio();
    let dataArray = null;
    let freqDataArray = null; // 🌟 毎フレーム生成を避けるための配列
    let isRunning = false;
    let isFileMode = false;
    let lastTime = 0; 

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048; // 自己相関に必要な十分なバッファサイズ
        dataArray = new Float32Array(analyser.fftSize);
        freqDataArray = new Uint8Array(analyser.frequencyBinCount); // 🌟 初期化
      }
    }

    // 🌟 解析パラメータと状態変数
    let TARGET_FREQ = 662.24; // 🌟 変数に変更（オートで追従）
    let TARGET_NAME = "E5";
    let peakVol = 0;
    let smoothedCents = 0;
    let smoothedOvertone = 0;

    // 🌟 アドバイスのデータベース（フローチャートから移植）
    const adviceDatabase = {
      ADV_A: { title: "息の力強さ不足による低ピッチ", icon: "💨", action: "お腹（腹筋）を凹ませて圧力を加え、ホースの先を絞って水を遠くに飛ばすように「まっすぐでスピードの速い息」を楽器に送り込みましょう。", targetBody: "腹筋・呼吸圧" },
      ADV_B: { title: "過度なアンブシュア締め付け（息詰まり）", icon: "👄", action: "唇の噛み締めを一度緩め、喉の奥をあくびをする時のように広げましょう。「フー」ではなく「ボー」と深く太い発音をするイメージで。", targetBody: "顎・アンブシュアの脱力" },
      ADV_C: { title: "息は良好だが、アンブシュアの締めすぎ", icon: "🎺", action: "息のパワーはそのままキープしつつ、口の両口角の緊張をほんの1ミリだけ緩め、音の重心を下に落とすイメージで。", targetBody: "アンブシュア微調整" },
      ADV_D: { title: "喉の閉塞による音の潰れ・上ずり", icon: "🧣", action: "口の中に温かいスープを含んでいるようなイメージで、口腔内と喉を大きく広げましょう。母音の「ア」または「オ」の形で。", targetBody: "口腔の容積・喉の開放" },
      ADV_E: { title: "良い響きだが、息の支えの緩み", icon: "⚓", action: "音が鳴り始めた後も、腹圧（お腹の張り）を一定に保ち、息のスピードが最後まで衰えないように支え続けてください。", targetBody: "丹田（お腹）のキープ" },
      ADV_F: { title: "息の収束不足（まとまりのない遅い息）", icon: "🌪️", action: "アパチュア（唇の息の出口）の穴が大きすぎる可能性があります。唇の中心をキュッと少しだけ引き締め、息の焦点を一点に絞り込んで。", targetBody: "アパチュアのコントロール" },
      ADV_G: { title: "【理想状態】パーフェクト・トーン", icon: "👑", action: "今このときの「お腹の適度な張り」「唇の柔軟性」「口の中の広さ」のバランスを脳に記憶させましょう。", targetBody: "全身のベストバランス維持" },
      ADV_H: { title: "音程は正確だが、響きが薄い（平坦な音）", icon: "🌫️", action: "息の量を1割増やし、アンブシュアを硬くするのではなく、「楽器の奥で音が豊かに反響する」ように息を広く深く吹き込みましょう。", targetBody: "共鳴を促す息の太さ" }
    };

    // 🌟 音階テーブルと自動追従機能の追加
    const SCALE_TABLE = [
      {"name": "F3", "freq": 175.40}, {"name": "F#3", "freq": 185.83}, {"name": "G3", "freq": 196.88}, {"name": "Ab3", "freq": 208.59}, {"name": "A3", "freq": 221.00}, {"name": "Bb3", "freq": 234.14}, {"name": "B3", "freq": 248.06},
      {"name": "C4", "freq": 262.81}, {"name": "C#4", "freq": 278.43}, {"name": "D4", "freq": 295.00}, {"name": "Eb4", "freq": 312.54}, {"name": "E4", "freq": 331.12}, {"name": "F4", "freq": 350.81}, {"name": "F#4", "freq": 371.67},
      {"name": "G4", "freq": 393.76}, {"name": "Ab4", "freq": 417.18}, {"name": "A4", "freq": 442.00}, {"name": "Bb4", "freq": 468.28}, {"name": "B4", "freq": 496.13},
      {"name": "C5", "freq": 525.63}, {"name": "C#5", "freq": 556.87}, {"name": "D5", "freq": 590.00}, {"name": "Eb5", "freq": 625.07}, {"name": "E5", "freq": 662.24}, {"name": "F5", "freq": 701.63}
    ];

    function getClosestScale(freq) {
      let closest = SCALE_TABLE[0];
      let minDiff = Math.abs(freq - closest.freq);
      for(let i=1; i<SCALE_TABLE.length; i++) {
        let diff = Math.abs(freq - SCALE_TABLE[i].freq);
        if(diff < minDiff) {
          minDiff = diff;
          closest = SCALE_TABLE[i];
        }
      }
      return closest;
    }

    // 🌟 高精度ピッチ検出アルゴリズム (YINアルゴリズム完全版)
    function autoCorrelate(buffer, sampleRate) {
      let rms = 0;
      for (let i = 0; i < buffer.length; i++) rms += buffer[i] * buffer[i];
      rms = Math.sqrt(rms / buffer.length);
      if (rms < 0.01) return -1; // ノイズ除去

      const halfBufferSize = Math.floor(buffer.length / 2);
      const yinBuffer = new Float32Array(halfBufferSize);

      // 1. 差分関数 (Difference function)
      for (let tau = 0; tau < halfBufferSize; tau++) {
        for (let i = 0; i < halfBufferSize; i++) {
          let delta = buffer[i] - buffer[i + tau];
          yinBuffer[tau] += delta * delta;
        }
      }

      // 2. 累積平均正規化差分関数 (Cumulative mean normalized difference)
      yinBuffer[0] = 1;
      let runningSum = 0;
      for (let tau = 1; tau < halfBufferSize; tau++) {
        runningSum += yinBuffer[tau];
        yinBuffer[tau] *= tau / runningSum;
      }

      // 3. 絶対閾値によるピッチ探索 (Absolute threshold)
      let tauEstimate = -1;
      const threshold = 0.15; // YINアルゴリズムの標準的な閾値
      for (let tau = 2; tau < halfBufferSize; tau++) {
        if (yinBuffer[tau] < threshold) {
          while (tau + 1 < halfBufferSize && yinBuffer[tau + 1] < yinBuffer[tau]) {
            tau++;
          }
          tauEstimate = tau;
          break;
        }
      }

      // 閾値を下回るものがなければ、全体から最小値を探す
      if (tauEstimate === -1) {
        let minVal = Infinity;
        for (let tau = 2; tau < halfBufferSize; tau++) {
          if (yinBuffer[tau] < minVal) {
            minVal = yinBuffer[tau];
            tauEstimate = tau;
          }
        }
        if (minVal > 0.5) return -1; // 周期性なし
      }

      // 4. 放物線補間による精度の極限向上 (Parabolic interpolation)
      let betterTau = tauEstimate;
      if (tauEstimate > 0 && tauEstimate < halfBufferSize - 1) {
        let s0 = yinBuffer[tauEstimate - 1];
        let s1 = yinBuffer[tauEstimate];
        let s2 = yinBuffer[tauEstimate + 1];
        let shift = 0.5 * (s2 - s0) / (2 * s1 - s2 - s0);
        // ゼロ除算を防止しつつ補間
        if (Math.abs(2 * s1 - s2 - s0) > 0.0001) {
          betterTau = tauEstimate + shift;
        }
      }

      return sampleRate / betterTau;
    }

    // 🌟ファイル入力とシークバーのイベント処理
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      audioElement.src = url;
      audioElement.load();
      
      btnPlayFile.disabled = false;
      btnPlayFile.classList.replace('text-slate-500', 'text-emerald-400');
      seekBar.disabled = false;
    });

    audioElement.addEventListener('loadedmetadata', () => {
      seekBar.max = audioElement.duration;
      updateTimeDisplay(audioElement.currentTime);
    });

    audioElement.addEventListener('timeupdate', () => {
      if (!seekBar.matches(':active')) {
        seekBar.value = audioElement.currentTime;
      }
      updateTimeDisplay(audioElement.currentTime);
    });

    seekBar.addEventListener('input', () => {
      audioElement.currentTime = seekBar.value;
      updateTimeDisplay(audioElement.currentTime);
    });

    audioElement.addEventListener('ended', () => {
      btnPlayFile.textContent = "PLAY";
      btnPlayFile.classList.replace('bg-slate-700', 'bg-slate-800');
    });

    function updateTimeDisplay(current) {
      if (isNaN(current)) return;
      const m = Math.floor(current / 60);
      const s = Math.floor(current % 60);
      timeDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // 🌟ファイル再生ボタンの処理
    btnPlayFile.addEventListener('click', () => {
      initAudioContext();
      
      if (!mediaElementSource) {
        mediaElementSource = audioCtx.createMediaElementSource(audioElement);
      }

      // マイクが動いていたらUIをリセット
      if (isRunning && !isFileMode) {
        if (microphone) microphone.disconnect();
        btnStart.textContent = "MIC START";
        btnStart.classList.replace('bg-slate-700', 'bg-emerald-500');
      }

      // ファイルソースを接続し、スマホのスピーカーからも音を出す
      try { mediaElementSource.disconnect(); } catch(e) {}
      try { analyser.disconnect(); } catch(e) {}
      mediaElementSource.connect(analyser);
      analyser.connect(audioCtx.destination); 

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (audioElement.paused) {
        audioElement.play();
        btnPlayFile.textContent = "PAUSE";
        btnPlayFile.classList.replace('bg-slate-800', 'bg-slate-700');
        isFileMode = true;
        diagPanel.classList.remove('hidden');
        
        if (!isRunning) {
          isRunning = true;
          lastTime = audioCtx.currentTime;
          requestAnimationFrame(processAudio);
        }
      } else {
        audioElement.pause();
        btnPlayFile.textContent = "PLAY";
        btnPlayFile.classList.replace('bg-slate-700', 'bg-slate-800');
      }
    });

    // --- マイク起動処理 (iOSはユーザーアクション必須) ---
    btnStart.addEventListener('click', async () => {
      if (isRunning && !isFileMode) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
        });

        initAudioContext();

        // ファイル再生中なら止める
        if (isFileMode) {
          audioElement.pause();
          btnPlayFile.textContent = "PLAY";
          btnPlayFile.classList.replace('bg-slate-700', 'bg-slate-800');
        }

        // マイクを接続し、スピーカー出力は切る（ハウリング防止のため超重要）
        try { if (mediaElementSource) mediaElementSource.disconnect(); } catch(e) {}
        try { analyser.disconnect(); } catch(e) {}
        try { if (microphone) microphone.disconnect(); } catch(e) {}
        
        microphone = audioCtx.createMediaStreamSource(stream);
        microphone.connect(analyser);

        isRunning = true;
        isFileMode = false;
        btnStart.textContent = "RUNNING";
        btnStart.classList.replace('bg-emerald-500', 'bg-slate-700');
        diagPanel.classList.remove('hidden');

        lastTime = audioCtx.currentTime;
        requestAnimationFrame(processAudio);

      } catch (err) {
        alert("マイクへのアクセスが拒否されたか、エラーが発生しました: " + err.message);
      }
    });

    // --- メイン解析・描画ループ ---
    function processAudio() {
      if (!isRunning) return;

      const sampleRate = audioCtx.sampleRate; // ブラウザのサンプリングレート

      // 最新の波形データと周波数データを取得
      analyser.getFloatTimeDomainData(dataArray);
      analyser.getByteFrequencyData(freqDataArray); // 🌟 ループ外で作成した配列を再利用

      let sumSq = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sumSq += dataArray[i] * dataArray[i];
      }

      // --- 1. 音量 (RMS) の計算 ---
      let rms = Math.sqrt(sumSq / dataArray.length);
      let displayVol = rms * 500; 
      
      if (displayVol < 2.0) displayVol = 0;

      if (displayVol > peakVol) peakVol = displayVol;
      else {
        peakVol -= 2.0; 
        if (peakVol < 0) peakVol = 0;
      }

      let volPercent = Math.min(displayVol, 100);
      let peakPercent = Math.min(peakVol, 100);
      volBar.style.width = `${volPercent}%`;
      volPeak.style.left = `${peakPercent}%`;

      // --- 2. ピッチ (自己相関法) の計算 ---
      let detectedFreq = autoCorrelate(dataArray, sampleRate);
      let currentCents = 0;
      
      if (detectedFreq !== -1 && displayVol > 5.0) {
        // 🌟 オートチューナー機能: 一番近い音階にターゲットを自動設定
        let target = getClosestScale(detectedFreq);
        TARGET_FREQ = target.freq;
        TARGET_NAME = target.name;
        document.getElementById('target-display').textContent = `Target: ${TARGET_NAME} (${TARGET_FREQ.toFixed(1)}Hz)`;

        // 🌟 ターゲット周波数とのズレを「セント(Cents)」単位で計算
        currentCents = 1200 * Math.log2(detectedFreq / TARGET_FREQ);
        
        // オクターブ間違いや異常値の除去
        if (Math.abs(currentCents) > 100) currentCents = smoothedCents;
      } else {
        currentCents = smoothedCents; // 音がない時や不明な時は維持
      }
      
      // スムージング処理でメーターの動きを滑らかに
      smoothedCents = smoothedCents * 0.8 + currentCents * 0.2;

      // --- 3. 倍音量 (Overtone) の計算 ---
      let baseEnergy = 0;
      let overEnergy = 0;
      let binFreq = sampleRate / analyser.fftSize;

      for (let i = 0; i < freqDataArray.length; i++) {
          let f = i * binFreq;
          // 基音付近のエネルギー
          if (f > TARGET_FREQ * 0.8 && f < TARGET_FREQ * 1.2) {
              baseEnergy += freqDataArray[i]; 
          // 2倍音以上の高次倍音エネルギー
          } else if (f >= TARGET_FREQ * 1.8 && f < 5000) {
              overEnergy += freqDataArray[i]; 
          }
      }
      
      let overtoneScore = 0;
      if (baseEnergy > 0 && displayVol > 5.0) {
          let ratio = overEnergy / baseEnergy; 
          overtoneScore = Math.min(100, ratio * 40); // 0〜100%にスケーリング
      }
      smoothedOvertone = smoothedOvertone * 0.9 + overtoneScore * 0.1;
      
      // 倍音バーのUI更新
      overtoneBar.style.width = `${smoothedOvertone}%`;

      // --- 4. 🌟 演奏逆引きコーチAI 診断ロジック ---
      let advId = null;
      if (displayVol >= 5.0) {
        let isVolOk = volPercent >= 35;
        let isPitchHigh = smoothedCents > 5;   // +5セント以上
        let isPitchLow = smoothedCents < -5;   // -5セント以下
        let isOverOk = smoothedOvertone >= 40;

        // フローチャートの分岐をコード化
        if (!isVolOk) {
          advId = isPitchLow ? "ADV_A" : "ADV_B";
        } else {
          if (isPitchHigh) {
            advId = isOverOk ? "ADV_C" : "ADV_D";
          } else if (isPitchLow) {
            advId = isOverOk ? "ADV_E" : "ADV_F";
          } else {
            advId = isOverOk ? "ADV_G" : "ADV_H";
          }
        }
        
        // 🌟【修正】音量が十分な時のみ診断結果を更新（一時停止・無音時は直前を保持）
        if (advId) {
          const diag = adviceDatabase[advId];
          diagTitle.textContent = diag.icon + " " + diag.title;
          diagAction.textContent = diag.action;
          document.getElementById('diag-target-body').textContent = diag.targetBody;
        }
      }

      // --- 5. UI更新: ピッチメーターの描画 ---
      // 🌟 キャンバスのピクセル解像度をCSSの表示サイズに同期させる（ぼやけ・描画不良の防止）
      const rect = pitchCanvas.getBoundingClientRect();
      if (pitchCanvas.width !== rect.width || pitchCanvas.height !== rect.height) {
        pitchCanvas.width = rect.width;
        pitchCanvas.height = rect.height;
      }

      const w = pitchCanvas.width;
      const h = pitchCanvas.height;
      pitchCtx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h - 5; // 下部中心点
      // キャンバスサイズに合わせて半径を計算
      const radius = Math.min(cx - 20, h - 30);

      // 背景の扇形エリア
      pitchCtx.beginPath();
      pitchCtx.arc(cx, cy, radius, Math.PI, 0);
      pitchCtx.fillStyle = '#0f172a'; // slate-950
      pitchCtx.fill();

      // 外枠のアーチ線
      pitchCtx.beginPath();
      pitchCtx.arc(cx, cy, radius, Math.PI, 0);
      pitchCtx.strokeStyle = '#334155';
      pitchCtx.lineWidth = 2;
      pitchCtx.stroke();

      // 目盛りの描画 (中心0セント、左右に±25セント)
      for(let dev = -25; dev <= 25; dev += 5) {
         let angle = -Math.PI / 2 + (dev / 25) * (Math.PI / 3); // 左右60度ずつ振る
         let isCenter = dev === 0;
         let isMajor = dev % 25 === 0; // ±25と0を強調表示
         let length = isCenter ? 15 : (isMajor ? 10 : 5);
         
         pitchCtx.beginPath();
         pitchCtx.moveTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
         pitchCtx.lineTo(cx + Math.cos(angle) * (radius - length), cy + Math.sin(angle) * (radius - length));
         pitchCtx.strokeStyle = isCenter ? '#10b981' : (isMajor ? '#64748b' : '#334155');
         pitchCtx.lineWidth = isCenter ? 3 : 2;
         pitchCtx.stroke();

         // 数値ラベル
         if (isMajor || dev === 0) {
           pitchCtx.fillStyle = isCenter ? '#10b981' : '#64748b';
           pitchCtx.font = "10px sans-serif";
           pitchCtx.textAlign = "center";
           pitchCtx.textBaseline = "top";
           let textRadius = radius - length - 15;
           pitchCtx.fillText(dev === 0 ? "0" : (dev > 0 ? "+25" : "-25"), cx + Math.cos(angle) * textRadius, cy + Math.sin(angle) * textRadius);
         }
      }

      // 針（メーター）の描画
      // 振り切れ処理（±26セントで針を止める）
      let displayDev = Math.max(-26, Math.min(26, smoothedCents));
      let meterAngle = -Math.PI / 2 + (displayDev / 25) * (Math.PI / 3);
      
      pitchCtx.beginPath();
      pitchCtx.moveTo(cx, cy);
      pitchCtx.lineTo(cx + Math.cos(meterAngle) * (radius - 5), cy + Math.sin(meterAngle) * (radius - 5));
      // ±5セント以内なら緑、±15セント以内なら黄、それ以上は赤
      pitchCtx.strokeStyle = Math.abs(displayDev) < 5 ? '#10b981' : (Math.abs(displayDev) < 15 ? '#eab308' : '#ef4444');
      pitchCtx.lineWidth = 3;
      pitchCtx.lineCap = "round";
      pitchCtx.stroke();

      // 中央のピン留め
      pitchCtx.beginPath();
      pitchCtx.arc(cx, cy, 8, 0, Math.PI * 2);
      pitchCtx.fillStyle = '#1e293b';
      pitchCtx.fill();
      pitchCtx.strokeStyle = '#475569';
      pitchCtx.lineWidth = 2;
      pitchCtx.stroke();

      // 現在の正確な数値をキャンバス内（針の根元上部）にも描画
      pitchCtx.fillStyle = Math.abs(displayDev) < 5 ? '#10b981' : '#94a3b8';
      pitchCtx.font = "bold 22px monospace";
      pitchCtx.textAlign = "center";
      pitchCtx.fillText((smoothedCents > 0 ? "+" : "") + smoothedCents.toFixed(1), cx, cy - radius / 2 - 10);
      pitchCtx.font = "10px sans-serif";
      pitchCtx.fillStyle = '#64748b';
      pitchCtx.fillText("cent", cx, cy - radius / 2 + 5);

      requestAnimationFrame(processAudio);
    }
  </script>
</body>
</html>
